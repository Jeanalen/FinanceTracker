<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Expense Tracker</title>
		<link
			rel="stylesheet"
			href="{{ url_for('static', filename='css/homestyles.css') }}"
		/>
		<!-- Include Font Awesome for the trash icon -->
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
		/>
	</head>
	<body>
		<div class="container">
			<div class="user-info">
				<p>
					Welcome, {{ username }}!
					<a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
				</p>
			</div>

			<h1>Welcome to Expense Tracker</h1>
			<h2>Select a Category to Begin</h2>

			<ul id="category-list">
				{% for category in categories %}
				<li>
					<a href="{{ url_for('category_page', category=category['name']) }}">
						{{ category['name'] }}
					</a>
					<!-- Delete icon for categories -->
					<form
						action="{{ url_for('delete_category', category_id=category['id']) }}"
						method="POST"
						style="display: inline"
						onsubmit="return confirm('Are you sure you want to delete this category? This action cannot be undone.')"
					>
						<button
							type="submit"
							style="border: none; background: none; color: red"
						>
							<i class="fas fa-trash-alt"></i>
						</button>
					</form>
				</li>
				{% endfor %}
			</ul>

			<h3>Add a New Category</h3>
			<!-- Add New Category Form -->
			<form action="{{ url_for('add_category') }}" method="POST">
				<label for="new_category">Add New Category:</label>
				<input type="text" id="new_category" name="new_category" required />
				<button type="submit">Add Category</button>
			</form>
		</div>
	</body>
</html>
